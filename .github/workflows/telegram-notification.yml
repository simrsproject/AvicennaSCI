name: Telegram Notification

on:
  push:
  pull_request:
    types:
      - closed

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram Notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}

          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}

          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.html_url }}

          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}

        shell: bash

        run: |
          set -e

          if [ "$EVENT_NAME" = "push" ]; then

            MESSAGE="🚀 <b>GitHub Push</b>

📦 <b>Repository:</b> $REPOSITORY
🌿 <b>Branch:</b> $BRANCH_NAME
👤 <b>Author:</b> $ACTOR

📝 <b>Commit:</b>
$COMMIT_MESSAGE

🔗 <a href=\"$COMMIT_URL\">View Commit</a>"

          elif [ "$EVENT_NAME" = "pull_request" ] && \
               [ "$PR_MERGED" = "true" ]; then

            MESSAGE="🔀 <b>Pull Request Merged</b>

📦 <b>Repository:</b> $REPOSITORY
🔢 <b>PR:</b> #$PR_NUMBER

📝 <b>$PR_TITLE</b>

👤 <b>Merged by:</b> $ACTOR

🌿 $PR_HEAD_BRANCH
↓
🌿 $PR_BASE_BRANCH

🔗 <a href=\"$PR_URL\">View Pull Request</a>"

          else
            exit 0
          fi

          echo "========================================"
          echo "Telegram Notification"
          echo "========================================"
          echo ""
          echo "Event: $EVENT_NAME"
          echo "Repository: $REPOSITORY"
          echo ""
          echo "Message:"
          echo "$MESSAGE"
          echo ""
          echo "========================================"

          curl --fail-with-body \
            --request POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "message_thread_id=${THREAD_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}"
